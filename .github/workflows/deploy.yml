name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Deploy when code is pushed to main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout your repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Set up Node.js (optional if you have a build step)
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # 3️⃣ Install dependencies and build (optional for static sites)
      - name: Install dependencies
        run: npm install
        # Skip this if you have no build step

      - name: Build project
        run: npm run build
        # Skip this if you only have raw HTML/CSS/JS

      # 4️⃣ Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist  # Change to your build output folder
